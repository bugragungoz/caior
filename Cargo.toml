[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "xtask"]

[workspace.package]
version = "3.0.0-alpha.1"
edition = "2024"
license = "MIT"
authors = ["bugragungoz"]
rust-version = "1.88"

[workspace.dependencies]
caior-core = { path = "crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
