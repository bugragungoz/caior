# Developer runtimes: optional language runtimes, preselected only by the "developer" profile.
# Both products are pinned (no vendor-patched evergreen link exists): bump the version, URL,
# filename, detect key/min_version and run `xtask catalog refresh --force --id <id>` on update.

[category]
id = "developer"
name = { en = "Developer runtimes", tr = "Geliştirici çalışma ortamları" }
description = { en = "Optional language runtimes for writing and running code. Everyday apps and games do not need them.", tr = "Kod yazmak ve çalıştırmak için isteğe bağlı programlama dili ortamları. Günlük uygulamalar ve oyunlar bunlara ihtiyaç duymaz." }
order = 70
icon = "terminal"

# ---------------------------------------------------------------------------
# Python 3 (newest stable: 3.15.0, 2026-10-09, 'Latest Python 3 Release' on python.org)
# ---------------------------------------------------------------------------

[[package]]
id = "python-3-x64"
name = "Python 3.15 (x64)"
description = { en = "Optional developer tool, needed to run and write Python scripts and apps; installs Python 3.15 with pip for all users.", tr = "İsteğe bağlı geliştirici aracı; Python betiklerini ve uygulamalarını çalıştırmak ve yazmak için gerekir, Python 3.15'i pip ile tüm kullanıcılar için kurar." }
version = "3.15.0"
arch = "x64"
os_arch = ["x64"]
profiles = ["developer"]
order = 710
group = "python-3"
homepage = "https://www.python.org/"
notes = """
Sources: https://www.python.org/downloads/windows/ (3.15.0 is 'Latest Python 3 Release', 2026-10-09),
https://www.python.org/downloads/release/python-3150/ ('Windows installer (64-bit)', Recommended, 43.3 MB,
sha256 67d9a63e...d2d1f01d6f), https://docs.python.org/3.15/using/windows.html (4.1.10 'Advanced installation',
4.5 'Python 3.15 supports Windows 10 and newer', 4.11 'The full installer (deprecated)'),
winget-pkgs manifests/p/Python/Python/3/14/3.14.7 (Scope machine: Custom 'InstallAllUsers=1 PrependPath=1', burn;
no 3.15 manifest yet on 2026-10-10). Pinned: python.org has no stable 'latest' link; pick the newest 3.x.y on update.
Method: the classic full installer. It is deprecated since 3.14 and will not be produced for 3.16+, but it is the only
official silent all-users method: the Python install manager (MSIX/MSI) 'does not support installing runtimes per-machine'
and each user must install runtimes themselves, so it cannot be deployed silently by an elevated worker.
Before 3.16 this package must move to another method (or py install --target as admin, which the docs call an emulation).
Installer sources are unchanged from 3.14.8 (Tools/msi/bundle/bundle.wxs, bootstrap/PythonBootstrapperApplication.cpp,
packagegroups/launcher.wxs, launcher/*.wxs are identical at tags v3.14.8 and v3.15.0).
Args: /quiet + documented options; Include_test=0 follows the docs' system-wide example. Include_launcher=1 installs
launcher.msi per-machine (py.exe in C:\\Windows); the 3.14 and 3.15 docs tables call this option 'Install Python
install manager', but the v3.15.0 bundle still ships the legacy py.exe launcher MSI (packagegroups/launcher.wxs).
Side effect (docs 4.1.9 note and Troubleshooting): the legacy launcher's py command takes priority over the Python
install manager's py; install-manager users can remove 'Python Launcher' from Installed apps. Kept because it is the
installer default and the docs' system-wide example keeps it (it also provides the .py file association).
/norestart is the WiX Burn engine switch: without it PythonBA restarts the PC by itself in /quiet mode when a reboot
is needed (OnApplyComplete/_allowRestart).
1638 = ERROR_PRODUCT_VERSION, returned by PythonBA OnPlan when a newer 3.15.x is installed.
Detect: PEP 514 key written by exe.msi (Tools/msi/exe/exe_reg.wxs: Version = LongVersion, REG_SZ, e.g. '3.15.0');
x64 tag is plain '3.15' (PCbuild/python.props PyArchExt is empty for amd64), HKMU = HKLM for all-users installs.
Limitation: a pre-release writes Version '3.15.0rcN' (LongVersion = PythonVersion), which the lenient version parser
reads as 3.15.0, so an all-users 3.15.0 release candidate counts as installed.
Confirmed on the dev host with 3.14: HKLM\\SOFTWARE\\Python\\PythonCore\\3.14 (64-bit view) Version REG_SZ '3.14.7'.
Each minor version is side by side (own key, own Program Files\\Python3xx folder), so 3.13/3.14 do not count as 3.15.
value = "Version" is required because other tools add subkeys under the same tag key (pywin32_postinstall.py writes
HKLM ...\\PythonCore\\<winver>\\Help when run as admin), which can keep the key alive after Python is uninstalled.
The burn bundle's own ARP entry is always per-user (HKCU of the elevating account; seen on the dev host), so an
uninstall rule is not reliable; the HKLM PEP 514 key is. Per-user installs (HKCU) and install-manager runtimes
(tag '3.15-64') are not counted, because this package installs for all users.
Upgrades: an older 3.15.x shows as outdated; the bundle (UpgradeCode is per minor version) does a major upgrade and
keeps the old TargetDir. PythonBA LoadOptionalFeatureStates reads HKCU before HKLM, so with an existing per-user 3.15
install the upgrade may stay per-user and the HKLM key may not appear (not verified; Sandbox test).
os_arch: offered on x64 Windows only; ARM64 Windows gets the native arm64 build (python-3-arm64).
"""

[package.source]
url = "https://www.python.org/ftp/python/3.15.0/python-3.15.0-amd64.exe"
filename = "python-3.15.0-amd64.exe"
size = 45383680
signer = ["Python Software Foundation"]
sha256 = "67d9a63eb145a34aa939f02eadbf8c57f21fcdd6decb901ccac578d2d1f01d6f"

[package.install]
kind = "exe"
args = "/quiet /norestart InstallAllUsers=1 PrependPath=1 Include_launcher=1 Include_test=0"
success_codes = [0, 1638]
reboot_codes = [3010, 1641]
timeout_sec = 1200

[package.detect]
kind = "registry"
hive = "HKLM"
key = 'SOFTWARE\Python\PythonCore\3.15'
view = "64"
value = "Version"
version_value = "Version"
min_version = "3.15.0"

