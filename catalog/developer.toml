version = "24.21.0"
arch = "x64"
os_arch = ["x64"]
profiles = ["developer"]
order = 720
group = "nodejs-lts"
warning = { en = "Replaces an older Node.js installed with the official installer; only one version can be installed at a time.", tr = "Resmi kurulum programıyla kurulmuş eski bir Node.js sürümünün yerine geçer; aynı anda yalnızca bir sürüm kurulu olabilir." }
homepage = "https://nodejs.org/"
notes = """
Sources: https://nodejs.org/dist/index.json (v24.21.0, lts 'Krypton', newest LTS on 2026-10-10),
https://nodejs.org/dist/v24.21.0/SHASUMS256.txt (PGP-signed list; x64 msi sha256 bb0eaee1...2cac),
https://github.com/nodejs/node/blob/v24.21.0/tools/msvs/msi/nodemsi/product.wxs,
winget-pkgs manifests/o/OpenJS/NodeJS/LTS/24.20.0 (wix, Scope machine, no extra switches; 24.21.0 not in winget yet).
https://github.com/nodejs/Release/blob/main/schedule.json: v26 becomes LTS on 2026-10-28 and v24 enters maintenance
on 2026-10-20, so move this entry to the newest 26.x after 2026-10-28 (new id/name/version, same UpgradeCode).
No evergreen link exists (nodejs.org/dist/latest-v24.x/ is a moving folder whose file name changes), so pinned.
Install: plain msiexec /qn; the default feature set installs node, npm, corepack and adds PATH. The optional
'native module tools' step (install_tools.bat, Chocolatey) only runs from the UI, never silently.
Detect: UpgradeCode {47C07A3A-42EF-4213-A85D-8F5A59077C28} is fixed in product.wxs for every Node.js version and
for both x64 and arm64; it is per-machine (WiX 4 Package default). Confirmed on the dev host
(HKCR\\Installer\\UpgradeCodes\\A3A70C74FE2431248AD5F8A59570C782, Node.js 24.20.0 -> shows as outdated).
MajorUpgrade replaces any older Node.js MSI install (e.g. 22.x) and refuses downgrades, hence the warning; a newer
Node.js (e.g. 26 Current) satisfies min_version and is left alone. The rule cannot tell x64 from arm64 Node.js;
os_arch keeps x64 off ARM64 Windows so only the native build is offered there.
Node.js from a zip, a version manager (nvm-windows, fnm, Volta) or winget's portable package has no MSI entry and is
not detected; installing then adds a second node.exe to PATH.
"""

[package.source]
url = "https://nodejs.org/dist/v24.21.0/node-v24.21.0-x64.msi"
filename = "node-v24.21.0-x64.msi"
size = 33230848
signer = ["OpenJS Foundation"]
sha256 = "bb0eaee134f9357f22aea915ee793343e627aefc1e66488164bac6915bce2cac"

[package.install]
kind = "msi"
success_codes = [0]
reboot_codes = [3010, 1641]
timeout_sec = 900

[package.detect]
