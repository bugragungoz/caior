notes = """
Sources: https://www.python.org/downloads/windows/ (3.15.0 'Windows installer (ARM64)', 2026-10-09),
https://www.python.org/downloads/release/python-3150/ (ARM64 installer, 42.6 MB, sha256 bb1c5123...ae487c4f),
https://docs.python.org/3.15/using/windows.html (4.1.10, 4.11), winget-pkgs manifests/p/Python/Python/3/14/3.14.7
(arm64, Scope machine, burn; no 3.15 manifest yet on 2026-10-10).
Same method, switches and exit codes as python-3-x64 (see its notes): classic full installer, deprecated since 3.14,
not produced for 3.16+, still the only official silent all-users method.
Detect: PEP 514 tag for ARM64 builds is '3.15-arm64' (PCbuild/python.props at v3.15.0: PyArchExt = -arm64;
Tools/msi/common.wxs REGISTRYKEY = Software\\Python\\PythonCore\\<ShortVersion><PyArchExt>), in the native (64) view.
The docs agree (4.11.6: registered tags carry 'a -32 or -arm64 suffix as normal for those platforms').
An x64 Python on ARM64 Windows writes '3.15' instead, so the two never collide.
"""

[package.source]
url = "https://www.python.org/ftp/python/3.15.0/python-3.15.0-arm64.exe"
filename = "python-3.15.0-arm64.exe"
size = 44649344
signer = ["Python Software Foundation"]
sha256 = "bb1c5123cc63d7bb37962ea7bf65e2b06389be9e5d48b6b532346d42ae487c4f"

[package.install]
kind = "exe"
args = "/quiet /norestart InstallAllUsers=1 PrependPath=1 Include_launcher=1 Include_test=0"
