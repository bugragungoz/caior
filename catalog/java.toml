# Java runtimes and development kits.
#
# Temurin MSI facts (from the installer's WiX source, github.com/adoptium/installer wix/Main.wxs.template
# and wix/Includes/OpenJDK.Variables.wxi.template, plus adoptium.net/installation/windows):
# - Features: FeatureMain (files, required), FeatureEnvironment (prepends <dir>\bin to PATH, default),
#   FeatureJarFileRunWith (.jar opens with javaw, default), FeatureJavaHome (sets JAVA_HOME, not default),
#   FeatureOracleJavaSoft (writes Oracle's HKLM\SOFTWARE\JavaSoft keys, not default). INSTALLLEVEL=1 equals
#   the three defaults.
# - We never add FeatureOracleJavaSoft: it overwrites keys that belong to Oracle Java (the SetOracleJavaSoftKeys
#   component, e.g. "Java Runtime Environment\1.8" JavaHome, has no condition), and the installer README
#   (github.com/adoptium/installer wix/README.md) says it breaks starting Oracle Java from PATH once Temurin is
#   uninstalled, until Oracle Java is reinstalled. winget-pkgs installs with ADDLOCAL=ALL, which includes it;
#   we deliberately do not. Trade-off: an app that finds Java only through HKLM\SOFTWARE\JavaSoft (some exe
#   wrappers) will not see Temurin; it still finds it on PATH.
# - No INSTALLDIR: adoptium.net/installation/windows says "You must use INSTALLDIR with FeatureMain", but the
#   installer README describes INSTALLDIR only as the way to choose another folder, the CustomSetPerMachineFolder
#   action sets the default under Program Files, and winget-pkgs installs without it (Scope: machine).
# - JREs get the three default features only. JDKs also get FeatureJavaHome: JAVA_HOME should point to a JDK,
#   and a JRE installed later would otherwise take JAVA_HOME away from the developer's JDK.
# - Package has no Scope attribute, so WiX makes it per-machine (ALLUSERS=1); silent installs go to
#   %ProgramFiles%\Eclipse Adoptium\<jre|jdk>-<msi version>-hotspot.
# - UpgradeCode = md5(<category>-<major>-<platform>-<package type>-<secret seed>) (Build.OpenJDK_generic.cmd),
#   so it is fixed per JRE/JDK, feature line and arch, and differs for x86 / x64 / arm64. Checked in
#   winget-pkgs across many releases of each line. We detect with it (msi-product + min_version).
# - Each install also writes HKMU\SOFTWARE\Eclipse Adoptium\<JRE|JDK>\<msi version>\hotspot\MSI (Path, Main=1).
#   Not used for detection: x64 and arm64 builds write the same 64-bit view, and per-user installs land in HKCU.
#   No Temurin is installed on the build host (reg query of HKLM/HKCU "SOFTWARE\Eclipse Adoptium", both views,
#   2026-10-10), so this key could not be checked there.
# - UpgradeCode stability checked in winget-pkgs: 8 JRE x86/x64 identical in 8.0.412.8 to 8.0.504.1, 21 JRE in
#   21.0.1.12 to 21.0.12.101, 21 JDK in 21.0.3.9 to 21.0.12.101, 25 JRE/JDK in 25.0.0.36 to 25.0.4.101.
# - MSI ProductVersion is major.minor.security.(patch*100 + build): 21.0.12+8 -> 21.0.12.8,
#   respin 21.0.12.1+1 -> 21.0.12.101, so versions still sort correctly.
# - A JRE and a JDK of the same line do not conflict: different UpgradeCode, ProductCode and folder. Both put
#   bin on PATH; the one installed last comes first. The JDK contains a full runtime, so the JRE is redundant
#   next to it.
# - MajorUpgrade compares only the first three version fields (documented by Adoptium): a respin with the same
#   three fields installs side by side instead of replacing the older build. So a host with 21.0.12.8 shows
#   as outdated against min_version 21.0.12.101, and the update leaves the old 21.0.12.8 folder in place
#   (Adoptium: uninstall the old MSI first; the catalog cannot express that). A normal quarterly update
#   (21.0.12 -> 21.0.13) replaces the old build.
# - success_codes 1638 is Windows Installer's ERROR_PRODUCT_VERSION ("another version of this product is
#   already installed", learn.microsoft.com MsiExec error codes); Adoptium documents no exit codes of its own.
#   Installing over a newer build of the same line fails through MajorUpgrade's DowngradeErrorMessage (1603);
#   detection skips that case first.
# - Windows 32-bit: Adoptium stopped shipping it in 2026 (adoptium.net/news/2025/12/solaris-win32-removal,
#   github.com/adoptium/temurin-build/issues/4319, closed 2026-06-24). The last x86 build is 8u472-b08.
# - Windows aarch64: shipped for 21 since 21.0.5, not for 25 (adoptium.net/news/2026/08 release post;
#   github.com/adoptium/temurin/issues/298 lists 25.0.4.1 Windows aarch64 as not in plan).
# - Signers (refresh, 2026-10-10; both DigiCert Trusted G4 Code Signing RSA4096 SHA384 2021 CA1): the
#   current builds (8u504, 21.0.12.1, 25.0.4.1) are signed "Eclipse Foundation" (Bruxelles, BE); 8u472 x86 (Oct 2025) carries the older
#   "Eclipse.org Foundation, Inc." (Ottawa, CA) certificate, which expired 2026-07-17.
# - Hashes, ProductCodes and UpgradeCodes read by refresh (re-run with --force on 2026-10-10) match winget-pkgs
#   for every file served today; the Temurin hashes also match api.adoptium.net/v3/assets/latest checksums.

[category]
id = "java"
name = { en = "Java", tr = "Java" }
description = { en = "Java runtimes and development kits: Eclipse Temurin, the free OpenJDK build from Adoptium, and Oracle Java 8.", tr = "Java çalışma ortamları ve geliştirme kitleri: Adoptium'un ücretsiz OpenJDK derlemesi Eclipse Temurin ve Oracle Java 8." }
order = 50
icon = "coffee"

