# Visual C++ Redistributables.
# Sources: Microsoft Learn "Latest supported Visual C++ Redistributable downloads"
# (https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist), Microsoft Download
# Center pages, Aaron Stebner's archived Microsoft blog (silent switches, product codes) and
# the winget-pkgs manifests (manifests/m/Microsoft/VCRedist/*) as a cross-check.
# Detection keys were confirmed with reg query on a Windows 11 x64 host.

[category]
id = "vcredist"
name = { en = "Visual C++ Redistributables", tr = "Visual C++ Yeniden Dağıtılabilir Paketleri" }
description = { en = "Microsoft C and C++ runtime libraries that many programs and games need, from 2005 to the latest v14.", tr = "Birçok program ve oyunun ihtiyaç duyduğu Microsoft C ve C++ çalışma zamanı kitaplıkları, 2005'ten en güncel v14'e kadar." }
order = 10
icon = "cpu"

# ---------------------------------------------------------------- 2005 SP1 MFC Security Update

[[package]]
id = "vc-2005-x86"
name = "Visual C++ 2005 Redistributable (x86)"
description = { en = "Needed by 32-bit programs and games built with Visual Studio 2005.", tr = "Visual Studio 2005 ile derlenmiş 32 bit program ve oyunlar için gerekir." }
version = "8.0.50727.6195"
arch = "x86"
profiles = ["recommended", "gaming"]
order = 100
group = "vc-2005"
legacy = true
homepage = "https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist"
notes = "VC++ 2005 SP1 MFC Security Update (KB2538242, MS11-025), linked from the Learn page via Download Center id=26347 (microsoft.com/download/details.aspx?id=26347); same URL and hash in winget Microsoft.VCRedist.2005.x86. The EXE is an IExpress wrapper whose built-in command is a plain 'msiexec /i vcredist.msi' (UI shown), so plain /q is not silent; args are the silent form from Aaron Stebner's MS blog (learn.microsoft.com/archive/blogs/astebner/mailbag-how-to-perform-a-silent-install-of-the-visual-c-8-0-runtime-files-vcredist-packages) plus msiexec /norestart so /qn never reboots on its own. Product code {710F4C1C-...} from the same blog (.../updated-vc-8-0-runtime-redistributable-packages-are-included-in-visual-studio-2005-sp1) and winget; confirmed on the dev host (Uninstall WOW6432Node, DisplayVersion 8.0.61001, upgrade code {86C9D5AA-...}). The product code pins the exact build, so no min_version. Out of support since 2016-04-12. Hash matches winget's InstallerSha256; Authenticode Valid, CN=Microsoft Corporation."

[package.source]
url = "https://download.microsoft.com/download/8/B/4/8B42259F-5D70-43F4-AC2E-4B208FD8D66A/vcredist_x86.EXE"
filename = "vcredist_2005_x86.exe"
signer = ["Microsoft Corporation"]
size = 2710520
sha256 = "8648c5fc29c44b9112fe52f9a33f80e7fc42d10f3b5b42b2121542a13e44adfd"

[package.install]
kind = "exe"
args = '/q:a /c:"msiexec /i vcredist.msi /qn /norestart"'
success_codes = [0, 1638]
reboot_codes = [3010, 1641]
timeout_sec = 900

[package.detect]
kind = "msi-product"
product_code = "{710F4C1C-CC18-4C49-8CBF-51240C89A1A2}"

