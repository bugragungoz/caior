args = "/install /quiet /norestart"
success_codes = [0, 1638]
reboot_codes = [3010, 1641]
timeout_sec = 1200

[package.detect]
kind = "any"

[[package.detect.rules]]
kind = "registry"
hive = "HKLM"
key = 'SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\ARM64'
view = "32"
value = "Installed"
equals = 1
version_value = "Version"
min_version = "14.51.36247"

[[package.detect.rules]]
kind = "registry"
hive = "HKLM"
key = 'SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\ARM64'
view = "64"
value = "Installed"
equals = 1
version_value = "Version"
min_version = "14.51.36247"
