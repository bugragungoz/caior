# Game runtimes.
# Researched 2026-10-10. Facts come from the vendors' own pages (Microsoft Download Center and
# Learn, NVIDIA, openal.org, LunarG); winget-pkgs manifests were used as a cross-check.
# Detection keys and files were checked on a Windows 11 x64 host (reg query, file versions, WMI).

[category]
id = "game"
name = { en = "Gaming", tr = "Oyun" }
description = { en = "Runtimes that PC games load: legacy DirectX parts, audio, physics and graphics libraries.", tr = "PC oyunlarının yüklediği çalışma zamanları: eski DirectX bileşenleri, ses, fizik ve grafik kitaplıkları." }
order = 30
icon = "gamepad"

# ---------------------------------------------------------------- DirectX June 2010

[[package]]
id = "directx-jun2010"
name = "DirectX End-User Runtimes (June 2010)"
description = { en = "Adds the D3DX9/10/11, XAudio 2.7, XInput 1.3 and XACT files that many games from 2004-2015 need.", tr = "2004-2015 arası birçok oyunun ihtiyaç duyduğu D3DX9/10/11, XAudio 2.7, XInput 1.3 ve XACT dosyalarını ekler." }
version = "9.29.1974.1"
arch = "neutral"
os_arch = ["x86", "x64"]
profiles = ["recommended", "gaming"]
order = 300
homepage = "https://www.microsoft.com/download/details.aspx?id=8109"
notes = "TODO"

