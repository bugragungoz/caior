group = "winget"
warning = { en = "Installs for all users without the Store license file. The winget command may only work after you sign out and back in. Not supported on Windows Server 2019, Windows Server 2022 or Server Core.", tr = "Store lisans dosyası olmadan tüm kullanıcılar için kurulur. winget komutu ancak oturumu kapatıp yeniden açtıktan sonra çalışabilir. Windows Server 2019, Windows Server 2022 ve Server Core'da desteklenmez." }
homepage = "https://learn.microsoft.com/windows/package-manager/winget/"
notes = "Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle from github.com/microsoft/winget-cli/releases/tag/v1.29.380 (the 'latest' release on 2026-10-10, published 2026-09-21; SHA256 equals the GitHub asset digest and winget-pkgs Microsoft.AppInstaller 1.29.380). Pinned, not releases/latest: the dependency zip entries carry version numbers and a newer bundle may need newer frameworks, so bundle and dependencies must come from one release; bump the tag, entry names and hashes together. Bundle AppxManifest (read, not run): Microsoft.DesktopAppInstaller 1.29.380.0, TargetDeviceFamily MinVersion 10.0.17763.0 (Learn 'Use WinGet': WinGet needs Windows 10 1809 / 17763 or later), PackageDependency WindowsAppRuntime.1.8 >= 8000.616.304.0, VCLibs.140.00 >= 14.0.33519.0, VCLibs.140.00.UWPDesktop >= 14.0.33728.0; no Microsoft.UI.Xaml any more. License: Microsoft's Repair-WinGetPackageManager -AllUsers (learn.microsoft.com/windows/package-manager/winget/, Microsoft.WinGet.Client AppxModuleHelper.cs) runs Add-AppxProvisionedPackage -Online -PackagePath <bundle> -LicensePath <release asset e53e159d00e04f729cc2180cffd1c02e_License1.xml>, then Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe for the current user. Our engine runs Add-AppxProvisionedPackage -SkipLicense, which the DISM docs reserve for apps that do not need a license, and does not register the package for the current user; per the same docs a package provisioned online is registered for the current user only at the next sign-in, so post-install detection may read 'not detected' until then (schema gaps reported). Supported OS (winget-cli README): Windows 10 1809+, Windows 11, Windows Server 2025; Server 2019/2022 only experimental and unsupported, never Server Core. Server 2019 shares build 17763 with Windows 10 1809, so os_min cannot exclude it; the warning says so (schema gap reported). Detection: appx family Microsoft.DesktopAppInstaller_8wekyb3d8bbwe (dev host: 1.29.380.0 x64). No min_version: App Installer is kept current by the Store on desktop Windows."

