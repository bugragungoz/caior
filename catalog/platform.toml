# ---------------------------------------------------------------- Windows App Runtime 1.8
# Every WindowsAppRuntimeInstall-<arch>.exe (1.8 and 2.x) carries the framework, Main, Singleton
# and DDLM packages for x86, x64 and arm64 (read from the AppxManifest files inside, nothing run).
# The installer picks what applies to the native OS arch (install.cpp IsPackageApplicable, via
# IsWow64Process2): x64 Windows gets x86+x64 frameworks and DDLMs plus x64 Main/Singleton; ARM64
# Windows 11 gets all three framework arches. So one installer per OS arch is enough (os_arch).
# The "latest" aliases (aka.ms/windowsappsdk/<major.minor>/latest/...) are not on any Learn page and
# are not kept current: on 2026-10-10 1.8/latest still served 1.8.10 (framework 8000.921.1539.0)
# while 1.8.12 was out. The documented versioned links are used instead, pinned with SHA256.

[[package]]
id = "windows-app-runtime-1-8-x86"
name = "Windows App Runtime 1.8 (x86)"
description = { en = "Needed by apps built with Windows App SDK 1.8 (WinUI 3). For 32-bit Windows.", tr = "Windows App SDK 1.8 (WinUI 3) ile geliştirilmiş uygulamalar için gerekir. 32 bit Windows içindir." }
version = "1.8.12 (1.8.260921001)"
arch = "x86"
os_min = "10.0.17763"
os_arch = ["x86"]
profiles = ["legacy"]
order = 410
group = "windows-app-runtime-1-8"
legacy = true
warning = { en = "Microsoft no longer supports this version and it gets no security updates. Install it only for apps that need it.", tr = "Microsoft bu sürümü artık desteklemiyor ve güvenlik güncellemesi almıyor. Yalnızca buna ihtiyaç duyan uygulamalar için kurun." }
homepage = "https://learn.microsoft.com/windows/apps/windows-app-sdk/downloads-archive"
notes = "aka.ms/windowsappsdk/1.8/1.8.260921001/windowsappruntimeinstall-x86.exe, the 1.8.12 (1.8.260921001, 2026-09-24) link on learn.microsoft.com/windows/apps/windows-app-sdk/downloads-archive; redirects to download.microsoft.com. Release channels page (learn.microsoft.com/windows/apps/windows-app-sdk/release-channels): 1.8 released 2025-09-09, latest patch 1.8.260921001, end of servicing 2026-09-24, so it is out of support and frozen: pinned, legacy. Kept because apps pin a Windows App SDK major.minor. Switch '--quiet' and return codes from learn.microsoft.com/windows/apps/windows-app-sdk/deploy-unpackaged-apps: 0 success, 0x80073d06 one or more packages failed, 0x80070005 not elevated; elevated runs provision Main/Singleton/DDLM for all users (frameworks cannot be provisioned by that API, install.cpp). Detection follows the doc's runtime check (framework and Main must both be registered): appx families Microsoft.WindowsAppRuntime.1.8_8wekyb3d8bbwe and MicrosoftCorporationII.WinAppRuntime.Main.1.8_8wekyb3d8bbwe (identity names read from the installer); min_version 8000.994.2142.0 = the framework and Main version all three 1.8.12 installers carry (read from their AppxManifest files). Singleton (shared by 1.x and 2.x) and DDLM (family name holds the version) are not checked. Dev host has only the 1.8 framework (8000.946.1701.0, from Store apps) and no Main.1.8, so it reads as not installed there, which is right for unpackaged 1.8 apps."

[package.source]
