# App platform runtimes: WebView2, Windows App Runtime, WinGet / App Installer, PowerShell 7.
# Sources: Microsoft Learn "Distribute your app and the WebView2 Runtime"
# (learn.microsoft.com/microsoft-edge/webview2/concepts/distribution), the WebView2 download page
# (developer.microsoft.com/microsoft-edge/webview2), Windows App SDK "Downloads", "Downloads archive",
# "Release channels" and "Deployment guide for unpackaged apps"
# (learn.microsoft.com/windows/apps/windows-app-sdk/...), the WindowsAppSDK installer source
# (github.com/microsoft/WindowsAppSDK/blob/main/installer/dev/install.cpp), the microsoft/winget-cli
# GitHub releases and its Microsoft.WinGet.Client module source (AppxModuleHelper.cs), Microsoft
# Learn "Use WinGet" and "DISM app package servicing options", "Install PowerShell 7 on Windows",
# the PowerShell GitHub releases, and the winget-pkgs manifests as a cross-check.
# Package identities inside the downloaded installers and bundles were read from their AppxManifest
# files without running anything. Detection keys and appx families were confirmed with reg query /
# Get-AppxPackage on a Windows 11 x64 host (2026-10-10).

[category]
id = "platform"
name = { en = "App platforms", tr = "Uygulama platformları" }
description = { en = "Shared runtimes that modern Windows apps build on: WebView2, Windows App Runtime, WinGet and PowerShell 7.", tr = "Modern Windows uygulamalarının üzerine kurulduğu ortak çalışma zamanları: WebView2, Windows App Runtime, WinGet ve PowerShell 7." }
order = 40
icon = "app-window"

# ---------------------------------------------------------------- Microsoft Edge WebView2 Runtime

[[package]]
id = "webview2-x86"
name = "Microsoft Edge WebView2 Runtime (x86)"
description = { en = "Needed by apps that show web content with Microsoft Edge WebView2. For 32-bit Windows.", tr = "Web içeriğini Microsoft Edge WebView2 ile gösteren uygulamalar için gerekir. 32 bit Windows içindir." }
version = "Evergreen (latest)"
arch = "x86"
os_arch = ["x86"]
profiles = ["recommended"]
order = 400
group = "webview2"
homepage = "https://developer.microsoft.com/microsoft-edge/webview2"
notes = "Evergreen Standalone Installer x86: go.microsoft.com/fwlink/?linkid=2099617 (the 'Standalone x86' link of developer.microsoft.com/microsoft-edge/webview2). It redirects to msedge.sf.dl.delivery.mp.microsoft.com/.../MicrosoftEdgeWebView2RuntimeInstallerX86.exe; on 2026-10-10 that is the same file and SHA256 as winget-pkgs Microsoft.EdgeWebView2Runtime 155.0.4283.45 (x86). Silent: 'MicrosoftEdgeWebView2RuntimeInstaller{X64/X86/ARM64}.exe /silent /install' (learn.microsoft.com/microsoft-edge/webview2/concepts/distribution, Offline deployment); run elevated it installs per machine. Architecture: the same doc says one Evergreen Runtime serves all apps on the device and the bootstrapper installs the runtime that matches the device architecture; only WebView2Loader.dll is per app architecture. So each standalone installer is offered only on its own OS arch and the native runtime also serves 32-bit apps. Detection per the same doc: pv (REG_SZ) under HKLM\\SOFTWARE\\WOW6432Node\\Microsoft\\EdgeUpdate\\Clients\\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5} on 64-bit Windows (plain SOFTWARE on 32-bit Windows; view 32 covers both) for per-machine, HKCU\\Software\\Microsoft\\EdgeUpdate\\Clients\\{...} for per-user; missing, null, empty or 0.0.0.0 means not installed. min_version 0.0.0.1 only turns pv = 0.0.0.0 into 'outdated'; an empty pv still reads as installed (schema gap reported). No patch floor: the runtime updates itself. winget-pkgs also lists -2147219416 / -2147219187 as success codes; Microsoft does not document them, so they are left out."

[package.source]
url = "https://go.microsoft.com/fwlink/?linkid=2099617"
filename = "MicrosoftEdgeWebView2RuntimeInstallerX86.exe"
evergreen = true
signer = ["Microsoft Corporation"]
size = 190068944

[package.install]
kind = "exe"
args = "/silent /install"
success_codes = [0]
reboot_codes = [3010, 1641]
timeout_sec = 1800

[package.detect]
