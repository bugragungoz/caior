# ---------------------------------------------------------------- WinGet dependencies (hidden)
# From DesktopAppInstaller_Dependencies.zip of the same winget-cli release as the bundle below
# (v1.29.380). Its DesktopAppInstaller_Dependencies.json lists Microsoft.VCLibs.140.00
# 14.0.33519.0, Microsoft.VCLibs.140.00.UWPDesktop 14.0.33728.0 and
# Microsoft.WindowsAppRuntime.1.8 8000.616.304.0, matching the PackageDependency elements of the
