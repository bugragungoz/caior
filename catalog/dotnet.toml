# .NET Framework and modern .NET runtimes.
# Detection facts were checked on a Windows 11 23H2 x64 host with reg query:
#   NDP\v4\Full Release = 533320 (4.8.1, built in) in both registry views; the rules read the
#   native (64) view, which Windows ignores on 32-bit systems.
#   dotnet\Setup\InstalledVersions\<arch>\sharedfx\<framework> exists only in the
#   32-bit view (WOW6432Node), for x64 and x86 alike; one REG_DWORD 1 per version.
#   The installers write it from a Bitness="always32" component for x86/x64/arm64
#   (dotnet/arcade src/Microsoft.DotNet.Build.Tasks.Installers/build/wix5/product/registrykeys.wxs;
#   same template in dotnet/core-setup release/3.1), so arm64 lives under
#   InstalledVersions\arm64 in the 32-bit view too.

[category]
id = "dotnet"
name = { en = ".NET", tr = ".NET" }
description = { en = ".NET Framework and the modern .NET runtimes that desktop apps, games and web apps need.", tr = "Masaüstü uygulamalarının, oyunların ve web uygulamalarının ihtiyaç duyduğu .NET Framework ve modern .NET çalışma zamanları." }
order = 20
icon = "layers"

# --- .NET Framework -----------------------------------------------------------

[[package]]
id = "netfx-35"
name = ".NET Framework 3.5 (includes 2.0 and 3.0)"
description = { en = "Older apps and games built for .NET Framework 2.0, 3.0 or 3.5 need this Windows feature.", tr = ".NET Framework 2.0, 3.0 veya 3.5 ile yazılmış eski uygulamalar ve oyunlar bu Windows özelliğine ihtiyaç duyar." }
version = "3.5 SP1"
arch = "neutral"
os_max = "10.0.27964"
profiles = ["recommended", "gaming"]
order = 200
homepage = "https://learn.microsoft.com/dotnet/framework/install/dotnet-35-windows"
notes = '''
Windows feature NetFx3, installed from Windows Update with DISM on Windows 10 and Windows 11
through 25H2 (the old dotnetfx35.exe is not used).
Command per Microsoft Learn: DISM /Online /Enable-Feature /FeatureName:NetFx3 /All
Offline: add /LimitAccess /Source:<media>\sources\sxs from media of the SAME Windows version.
Common failures: 0x800f081f / 0x800f0906 / 0x800f0907 (source not found, WSUS or policy blocks WU).
os_max: Insider build 27965 removed NetFx3 as an optional component and Windows 11 26H1
(build 28000) ships without it; there netfx-35-standalone is offered instead (devblogs
announcement 2026-02-05, Learn "Install .NET Framework 3.5 on Windows 11"). Windows 11 26H2
(Insider builds 26300 / 26340) is an enablement package on the 25H2 base and so stays on DISM
here; Learn only names 26H1 (build 28000), so confirm once 26H2 ships. Re-check os_max when a new
Windows release ships.
Sources: learn.microsoft.com/windows-hardware/manufacture/desktop/deploy-net-framework-35-by-using-deployment-image-servicing-and-management--dism
         learn.microsoft.com/troubleshoot/windows-client/application-management/dotnet-framework-35-installation-error
         learn.microsoft.com/dotnet/framework/install/dotnet-35-windows-11
         devblogs.microsoft.com/dotnet/dotnet-framework-3-5-moves-to-standalone-deployment-in-new-versions-of-windows
Support: .NET Framework 3.5 SP1 is supported until 2029-01-09 (Microsoft lifecycle), so not legacy.
'''

[package.install]
kind = "dism-feature"
feature = "NetFx3"
all = true
source_hint = { en = "Without Windows Update, mount a Windows ISO of the same version and build as this PC and use its sources\\sxs folder as the source.", tr = "Windows Update yoksa bu bilgisayarla aynı sürüm ve derlemedeki bir Windows ISO'sunu bağlayın ve kaynak olarak içindeki sources\\sxs klasörünü kullanın." }
success_codes = [0]
reboot_codes = [3010, 1641]
timeout_sec = 1800

[package.detect]
kind = "dism-feature"
feature = "NetFx3"

[[package]]
id = "netfx-35-standalone"
name = ".NET Framework 3.5 for Windows 11 26H1 (includes 2.0 and 3.0)"
description = { en = "Older apps and games built for .NET Framework 2.0, 3.0 or 3.5 need it; on Windows 11 26H1 it is a separate installer instead of a Windows feature.", tr = ".NET Framework 2.0, 3.0 veya 3.5 ile yazılmış eski uygulamalar ve oyunlar buna ihtiyaç duyar; Windows 11 26H1'de Windows özelliği değil, ayrı bir kurulum dosyasıdır." }
version = "3.5 SP1"
arch = "neutral"
os_min = "10.0.28000"
os_max = "10.0.28000"
profiles = ["recommended", "gaming"]
order = 201
homepage = "https://learn.microsoft.com/dotnet/framework/install/dotnet-35-windows-11"
notes = '''
From Windows 11 26H1 (build 28000) .NET Framework 3.5 is no longer a Windows component and
ships only as a standalone installer; Microsoft says the installer works ONLY on the Windows
version it is published for, so os_min = os_max = 10.0.28000 (compared without UBR). Add a new
entry when Microsoft publishes an installer for a later Windows release. On 25H2 and older,
netfx-35 (DISM NetFx3) is used instead.
Download: go.microsoft.com/fwlink/?LinkID=2337635 -> download.microsoft.com/.../DotNet35Setup.exe
(link on the Learn page "Install .NET Framework 3.5 on Windows 11"). The optional language pack
(fwlink 2347312, DotNet35LPSetup.exe) is not included.
Evergreen: on 2026-10-10 the fwlink served "Microsoft .NET Framework 3.5 (5087077)", file version
1.0.03391.144, i.e. KB5087077, the 2026-05-12 cumulative update that "delivers the full .NET
Framework 3.5 product as a standalone installer". Microsoft moves the link to newer cumulative
builds, so the signature is checked instead of a hash. After install Microsoft Update services
it, so no min_version.
Installer: WiX Burn bundle (.wixburn section). The FAQ documents /q and /quiet; /norestart and
/log are Burn's standard switches (without /norestart a quiet Burn bundle may restart by itself).
Exit codes are not documented beyond Burn's 0 / 3010 / 1641, so the defaults are kept.
The install does not survive a Windows feature upgrade (FAQ); detection then shows it missing.
Detection: HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP\v3.5 Install REG_DWORD = 1 (Microsoft
Learn, "Detect .NET Framework 1.0 through 4.0"). The DISM feature does not exist on 26H1, so the
registry rule is used. Not verified with a real install yet (needs a 26H1 machine or VM).
Support ends 2029-01-09 (FAQ, Microsoft .NET Framework lifecycle).
Sources: learn.microsoft.com/dotnet/framework/install/dotnet-35-windows-11
         learn.microsoft.com/dotnet/framework/install/dotnet-35-windows-11-faq
         learn.microsoft.com/dotnet/framework/install/how-to-determine-which-versions-are-installed
         support.microsoft.com/kb/5087077
         devblogs.microsoft.com/dotnet/dotnet-framework-3-5-moves-to-standalone-deployment-in-new-versions-of-windows
'''

[package.source]
url = "https://go.microsoft.com/fwlink/?LinkID=2337635"
filename = "dotnet35setup-win11-26h1.exe"
size = 105310344
evergreen = true
signer = ["Microsoft Corporation"]

[package.install]
kind = "exe"
args = '/quiet /norestart /log "{log}"'
success_codes = [0]
reboot_codes = [3010, 1641]
timeout_sec = 1800

[package.detect]
kind = "registry"
hive = "HKLM"
key = 'SOFTWARE\Microsoft\NET Framework Setup\NDP\v3.5'
view = "64"
value = "Install"
equals = 1

