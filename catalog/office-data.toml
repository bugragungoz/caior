homepage = "https://www.microsoft.com/download/details.aspx?id=54920"
notes = "Download Center id=54920 (published 11/18/2025): accessdatabaseengine_X64.exe, PE version 16.0.5044.1000; support ended on October 14, 2025 (replacement: Microsoft 365 Access Runtime). Pinned URL; sha256 matches both winget manifests. Args /quiet /norestart from winget. Developer profile per docs/PACKAGES.md; 64-bit is the Office default since 2019. Detection: winget ProductCode {90160000-00D1-0409-1000-0000000FF1CE} / UpgradeCode {00160000-00D1-0000-1000-0000000FF1CE} (1 = x64 in Office's scheme), not confirmed from the inner MSI. Second rule: ACE 16.0 OLE DB provider CLSID in the 64-bit view, confirmed on the dev host where Office 2024 C2R x64 registers it (Learn: M365/2021+ C2R exposes ACE, and Office side-by-side detection blocks the redist there), so the planner skips a futile install; the dev host shows this package as installed through that rule. No min_version (see the x86 entry). Only this bitness is in the developer profile: the planner rejects a plan that holds both sides of a conflict. winget lists Microsoft.VCRedist.2015+ as a dependency; not documented by Microsoft, so none is set."

