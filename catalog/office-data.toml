# ---------------------------------------------------------------- Access Database Engine 2016

[[package]]
id = "ace-2016-x86"
name = "Access Database Engine 2016 Redistributable (x86)"
description = { en = "Needed by 32-bit programs that read or write Access databases (.mdb, .accdb) or Excel and text files through the ACE OLE DB and ODBC drivers.", tr = "Access veritabanlarını (.mdb, .accdb), Excel ve metin dosyalarını ACE OLE DB ve ODBC sürücüleriyle okuyup yazan 32 bit programlar için gerekir." }
version = "16.0.5044.1000"
arch = "x86"
profiles = []
order = 610
conflicts = ["ace-2016-x64"]
group = "ace-2016"
legacy = true
warning = { en = "Pick the bitness of your installed Office: 32-bit Office needs x86, 64-bit Office needs x64. Only one of the two can be installed. Remove older Access Database Engine versions first. Microsoft 365 and Office 2021 or later already include this engine, and setup will not install next to them. Microsoft support ended on October 14, 2025.", tr = "Kurulu Office ile aynı bit sürümünü seçin: 32 bit Office için x86, 64 bit Office için x64. İkisinden yalnızca biri kurulabilir. Önce eski Access Database Engine sürümlerini kaldırın. Microsoft 365 ile Office 2021 ve sonrası bu motoru zaten içerir; kurulum bunların yanına yapılmaz. Microsoft desteği 14 Ekim 2025'te sona erdi." }
homepage = "https://www.microsoft.com/download/details.aspx?id=54920"
notes = "Download Center id=54920 (published 11/18/2025, re-checked 2026-10-10; it says to remove previous Access Database Engine versions before installing): accessdatabaseengine.exe, PE version 16.0.5044.1000; the page says support ended on October 14, 2025 and names the Microsoft 365 Access Runtime as the replacement (Click-to-Run, not packaged here). Pinned URL; sha256 matches both winget manifests (Microsoft.AccessDatabaseEngine.2016 and Microsoft.AccessDatabaseEngine2016). Args /quiet /norestart from winget (the page documents no switches). Not in a profile: x64 is the developer default and the two conflict. Detection: winget gives ProductCode {90160000-00D1-0409-0000-0000000FF1CE} (fits Office's product code scheme, 00D1 = ACE, 0 = x86) and UpgradeCode {00160000-00D1-0000-0000-0000000FF1CE}; the inner aceredist.msi cannot be read without extracting, so the upgrade code is not confirmed from the file. Second rule: the ACE 16.0 OLE DB provider CLSID {3BE786A2-...} in the 32-bit view, which the redist and Office builds that expose ACE (MSI Office 2016, M365/2021+ C2R per Learn 'cannot-use-odbc-or-oledb') register; with such Office the redist is not needed and setup refuses to run (Learn, archived: learn.microsoft.com/previous-versions/troubleshoot/microsoft-365/microsoft-365-apps/access/cannot-use-odbc-or-oledb, 'Office side-by-side detection will also prevent the installation'). Dev host (Office 2024 C2R x64) has the CLSID only in the 64-bit view, InprocServer32 under Office\\root\\VFS; no ACE MSI is registered there (RelatedProducts empty for both upgrade codes). No min_version: the inner MSI ProductVersion is not readable without extracting, ACE gets no more updates, and the Download Center asks to remove older versions first, so an in-place upgrade over an older ACE build is not expected to work. winget also lists Microsoft.VCRedist.2015+ as a dependency; Microsoft does not document one, so none is set."

[package.source]
url = "https://download.microsoft.com/download/3/5/c/35c84c36-661a-44e6-9324-8786b8dbe231/accessdatabaseengine.exe"
filename = "accessdatabaseengine.exe"
signer = ["Microsoft Corporation"]
size = 81621424
