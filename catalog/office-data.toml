# Office and data access runtimes.
# Sources: Microsoft Learn (VSTO runtime pages, ODBC and OLE DB driver download, install and release
# notes pages, the Access C2R/ACE troubleshooting article), Microsoft Download Center pages, and the
# winget-pkgs manifests (Microsoft.VSTOR, Microsoft.msodbcsql.18, Microsoft.AccessDatabaseEngine.2016)
# as a cross-check. The ODBC/OLE DB fwlinks are per release (old link ids keep serving the old build;
# checked 2026-10-10: the OLE DB 19.4.2 ids 2364026/2364027 still point at the 19.4.2 files), so those
# entries are pinned with a sha256 and must be bumped when Microsoft ships a new version.
# The x86 ODBC and OLE DB MSIs carry the launch condition "NOT VersionNT64" (read from the MSI tables),
# so they refuse to install on any 64-bit Windows; the 64-bit MSIs install the 32-bit driver as well.

[category]
id = "office-data"
name = { en = "Office and data", tr = "Office ve veri" }
description = { en = "Runtime for Office add-ins and drivers that let programs read Access and Excel files or connect to SQL Server.", tr = "Office eklentileri için çalışma zamanı ve programların Access ile Excel dosyalarını okumasını ya da SQL Server'a bağlanmasını sağlayan sürücüler." }
order = 60
icon = "database"

# ---------------------------------------------------------------- VSTO runtime

[[package]]
id = "vstor-2010"
name = "Visual Studio 2010 Tools for Office Runtime (x86 and x64)"
description = { en = "Needed by Office add-ins and document solutions built with Visual Studio (VSTO), such as many Excel and Outlook add-ins.", tr = "Visual Studio ile geliştirilmiş Office eklentileri ve belge çözümleri (VSTO) için gerekir; birçok Excel ve Outlook eklentisi bunu kullanır." }
version = "10.0.60917"
arch = "neutral"
profiles = ["recommended"]
order = 600
homepage = "https://learn.microsoft.com/visualstudio/vsto/how-to-install-the-visual-studio-tools-for-office-runtime-redistributable"
notes = "Learn 'Install the VSTO runtime redistributable' links fwlink 140384 -> Download Center id=105890 (aka.ms/VSTORuntimeDownload goes there too): vstor_redist.exe, version 10.0.60917 (page: 60917.00, published 7/15/2024; PE FileVersion 10.0.60917.00 from refresh), one file for x86 and x64. ARM64 support is not stated on the page. No evergreen file link exists, so the direct download.microsoft.com URL is pinned; sha256 matches winget Microsoft.VSTOR 10.0.60917. Args /q /norestart from winget (Microsoft documents no switches); 3010/1641 per winget. Detection: Learn 'Deploy a VSTO solution with Windows Installer' checks HKLM\\SOFTWARE\\Microsoft\\VSTO Runtime Setup\\v4R value Version for the redistributable (v4 is the copy Office installs; its sample condition is VSTORUNTIMEREDIST>=10.0.30319 OR OFFICERUNTIME>=10.0.21022). Only v4R is used here because this entry installs and tracks the redistributable. Both views are checked because an MSI search reads the 32-bit view on x64. Dev host (Office 2024 C2R) has only v4 = 10.0.60910 and v4M in the 32-bit view, no v4R, so this shows as missing there; installing the redist next to Office's copy is the documented add-in prerequisite path."

