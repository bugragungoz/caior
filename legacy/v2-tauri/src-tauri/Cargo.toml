[package]
name = "croxz-aio-runtimes"
version = "2.0.0"
description = "AIO Runtime Installer"
authors = ["bugragungoz"]
edition = "2021"

[lib]
name = "croxz_aio_runtimes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
winreg = "0.52"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
